name: Football Data Pipeline

on:
  schedule:
    # Runs every 4 hours
    - cron: "0 */2 * * *"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Pipeline
        env:
          FOOTBALL_API: ${{ secrets.FOOTBALL_API }}
          DATAORGTOKEN: ${{ secrets.DATAORGTOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          BASE_URL: ${{ secrets.BASE_URL }}
          TEAM_URL: ${{ secrets.TEAM_URL }}
          PLAYER_URL: ${{ secrets.PLAYER_URL }}
          LEAGUE_URL: ${{ secrets.LEAGUE_URL }}
          VENUES_URL: ${{ secrets.VENUES_URL }}

          PLAYER_TOPSCORERS: ${{ secrets.PLAYER_TOPSCORERS }}
          PLAYER_TOPASSISTS: ${{ secrets.PLAYER_TOPASSISTS }}
          PLAYER_YELLOW: ${{ secrets.PLAYER_YELLOW }}
          PLAYER_RED: ${{ secrets.PLAYER_RED }}

          DATAORG_MATCHES_URL: ${{ secrets.DATAORG_MATCHES_URL }}
          DATAORG_TEAMS_URL: ${{ secrets.DATAORG_TEAMS_URL }}
          DATAORG_MATCH_URL: ${{ secrets.DATAORG_MATCH_URL }}
          DATAORG_TOP_SCORER: ${{ secrets.DATAORG_TOP_SCORER }}

        run: |
          for attempt in 1 2 3 4 5
          do
            echo "ETL attempt $attempt/5"

            if python run_pipeline.py; then
              echo "ETL pipeline completed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Pipeline failed. Retrying in 30 seconds..."
              sleep 30
            fi
          done

          echo "ETL pipeline failed after 5 attempts."
          exit 1